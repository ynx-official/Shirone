<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Shirone 原站与 Nuxt 对比</title><style>body{font:16px/1.6 system-ui;margin:24px;background:#faf1f9;color:#363039}header{position:sticky;top:0;background:#faf1f9;padding:12px 0;z-index:1}h1{font-size:24px}label{margin-right:20px}select{font:inherit;padding:6px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}figure{margin:0}figcaption{padding:10px;background:white;border-radius:12px 12px 0 0}img{display:block;width:100%;border-radius:0 0 12px 12px}a{color:#715483}@media(max-width:800px){main{grid-template-columns:1fr}}</style><header><h1>原站 · 修复前 · 修复后</h1><label>页面 <select id="route"><option value="home">首页</option><option value="article">普通文章</option><option value="archive">归档</option><option value="albums">相册</option><option value="projects">项目</option></select></label><label>视口 <select id="size"><option value="desktop">桌面 1440×1000</option><option value="mobile">手机 390×844</option></select></label><label>位置 <select id="position"><option value="">首屏</option><option value="-content">内容区</option></select></label><p>截图来自实际运行的 Astro 4321 与 Nuxt 4322；点击图片可查看原尺寸。公开数据按迁移约定排除草稿，数量不与 Astro 开发模式强行一致。</p></header><main><figure><figcaption>原站 Astro</figcaption><a><img id="original" alt="原站截图"></a></figure><figure><figcaption>修复前 Nuxt</figcaption><a><img id="before" alt="修复前截图"></a></figure><figure><figcaption>修复后 Nuxt</figcaption><a><img id="after" alt="修复后截图"></a></figure></main><script>const selects=[...document.querySelectorAll('select')];function update(){const file=selects.map(e=>e.value);for(const phase of ['original','before','after']){const image=document.getElementById(phase);const path=phase+'/'+file[0]+'-'+file[1]+file[2]+'.png';image.src=path;image.parentElement.href=path;}}selects.forEach(e=>e.addEventListener('change',update));update();</script></html>
